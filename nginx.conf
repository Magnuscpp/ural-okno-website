# Nginx конфигурация для размещения сайта витрины Arbuz Doors на VPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Замените на ваш домен или IP сервера

    root /var/www/arbuz-doors;
    index index.html;

    # Gzip сжатие для молниеносной скорости загрузки
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических изображений и стилей
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
